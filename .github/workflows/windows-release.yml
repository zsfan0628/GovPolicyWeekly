name: Windows Build and Release

on:
  push:
    tags:
      - 'v[0-9]*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install -r requirements-windows-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Build and check Windows software
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PYTHONUTF8: '1'
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Website navigation regression tests failed' }
          $version = '1.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:RELEASE_TAG.TrimStart('v') }
          ./scripts/build_release.ps1 -Version $version
      - name: Save download files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/GovPolicyWeekly_Setup_*.exe
            release/GovPolicyWeekly_windows_portable.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Save check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-check-results
          path: release-check/*.json
          retention-days: 3
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "GovPolicyWeekly $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
